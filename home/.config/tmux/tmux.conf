# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hallazzang/tmux-reset'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'catppuccin/tmux'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-battery'

# counting
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# do not overwrite what I rename
set-option -g allow-rename off

# for nvim integration
setw -g mode-keys vi
set -g mouse on
set -ga terminal-overrides ',*256color*:smcup@:rmcup@'
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "screen-256color"
set -sa terminal-features ',xterm-256color:RGB'
set -g history-limit 50000000

# prefix
set -g prefix C-b
bind-key C-b send-prefix

### theme ###
set -g status-keys vi
# tokyo night
set -g @tokyo-night-tmux_window_id_style super
set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_git 0
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_window_tidy_icons 1

### plugins settings ###
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# continuum
set -g @continuum-restore 'on'
# don't resurrect programs
set -g @resurrect-processes 'false'

# fzf
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 80% -h 60% -m"
bind-key -n M-f run-shell -b "~/.config/tmux/plugins/tmux-fzf/main.sh"
bind-key -n M-w run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind-key -n M-s run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind-key -n M-x run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/process.sh kill"

# pane
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind-key < command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key > command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key -n M-Z resize-pane -Z
bind-key -n M-h select-pane -Z -L
bind-key -n M-j select-pane -Z -D
bind-key -n M-k select-pane -Z -U
bind-key -n M-l select-pane -Z -R
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# windows
bind-key -n M-n select-window -n
bind-key -n M-p select-window -p
bind-key -n M-N swap-window -t +1\; select-window -n
bind-key -n M-P swap-window -t -1\; select-window -p
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# copy mode
bind-key -n M-{ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

# sessions
bind-key N new-session

# mouse
bind-key -n M-m set -g mouse\; display 'Mouse: #{?mouse,ON,OFF}'

# reload conf
bind-key r source-file ~/.config/tmux/tmux.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
